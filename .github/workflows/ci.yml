# CI for Mirante. No secrets are used anywhere; every job is read-only on the repo.
# Third-party actions are pinned to full commit SHAs (the tag is in the trailing comment).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  # The primary gate: the whole Rust workspace on macOS (the supported platform).
  rust:
    name: rust (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup, never a Homebrew cargo (too old for the edition-2024 dependencies). With no
      # argument rustup installs the toolchain pinned in rust-toolchain.toml (and its components).
      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Toolchain versions
        run: |
          rustc -V && cargo -V && cargo clippy -V
          git --version
          /usr/bin/ssh-keygen -V 2>&1 || true
          sw_vers
      # Tests that commit set their own identity; this only covers any that do not.
      - name: Git identity for test repos
        run: |
          git config --global user.name "Mirante CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The e2e tests run the built binaries (mirante, mirante-daemon, mirante-hook).
      - name: cargo build --workspace
        run: cargo build --workspace --all-targets --locked
      - name: cargo test --workspace
        run: cargo test --workspace --locked
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo clippy (mirante-bridge/fake)
        run: cargo clippy --workspace --all-targets --locked --features mirante-bridge/fake -- -D warnings
      # Already part of the workspace run; repeated on its own so an e2e failure is obvious.
      - name: cargo test e2e
        run: cargo test -p mirante-cli --test e2e --locked

  # Linux is partially supported: the workspace compiles and is linted there; the core
  # crates' tests gate, the rest of the workspace's tests are informational until proven.
  rust-linux:
    name: rust (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Toolchain versions
        run: rustc -V && cargo -V && cargo clippy -V && git --version
      - name: Git identity for test repos
        run: |
          git config --global user.name "Mirante CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo clippy (workspace, Linux)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test (mirante-core, mirante-ipc)
        run: cargo test -p mirante-core -p mirante-ipc --locked
      - name: cargo build --workspace
        run: cargo build --workspace --all-targets --locked
      # Not a gate yet: the daemon's Linux paths (proctree, memory PSI, PTY) are not
      # exercised day to day. Promote to a gate once it is green.
      - name: cargo test --workspace (informational)
        continue-on-error: true
        run: cargo test --workspace --locked --no-fail-fast

  # The desktop app: frontend tests, typecheck and build, then the Tauri crate.
  cockpit:
    name: cockpit (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/cockpit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
          package_json_file: apps/cockpit/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/cockpit/pnpm-lock.yaml
      # The repo-root rust-toolchain.toml also covers src-tauri (rustup walks up to it).
      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Toolchain versions
        run: node -v && pnpm -v && rustc -V && cargo -V
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/cockpit/src-tauri -> target
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: pnpm test
        run: pnpm test
      - name: pnpm typecheck
        run: pnpm typecheck
      # Also produces dist/, which the Tauri crate embeds at compile time.
      - name: pnpm build
        run: pnpm build
      - name: cargo test (src-tauri)
        working-directory: apps/cockpit/src-tauri
        run: cargo test --locked
      - name: cargo clippy (src-tauri)
        working-directory: apps/cockpit/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

  # Not a gate: the tree is not rustfmt-clean yet. Reports the drift as a warning
  # annotation and stays green. Turn it into a gate once the tree is formatted.
  fmt:
    name: rustfmt (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: cargo fmt --check
        run: |
          cargo fmt --all --check \
            || echo "::warning title=rustfmt::the tree is not rustfmt-clean yet (non-blocking)"
