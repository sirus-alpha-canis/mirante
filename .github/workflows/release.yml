# Release: builds the CLI, daemon, hook and MCP server for both Mac architectures, publishes
# them as a GitHub Release, and (when the HOMEBREW_TAP_TOKEN secret exists) updates the
# formula in sirus-alpha-canis/homebrew-tap. How to cut a release: RELEASING.md.
# Third-party actions are pinned to full commit SHAs (the tag is in the trailing comment).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to (re)build and publish, e.g. v0.1.0"
        required: true
        type: string

# One release run per tag at a time; never cancel a half-published release.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      # The oldest macOS the binaries (and any C code in dependencies) are built for.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Tag matches the crate version
        id: version
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "::error::tag $TAG is not v<version>"; exit 1 ;; esac
          version="${TAG#v}"
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/mirante-cli/Cargo.toml | head -n1)"
          if [ "$crate" != "$version" ]; then
            echo "::error::tag $TAG but crates/mirante-cli is $crate"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # rustup, at the toolchain pinned in rust-toolchain.toml, plus the target.
      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add "${{ matrix.target }}"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Toolchain versions
        run: rustc -V && cargo -V && sw_vers && uname -m
      # No build cache on purpose: a release is built from a clean tree. The build id
      # embedded in mirante-daemon uses the tagged commit and its commit time.
      - name: cargo build --release
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          cargo build --release --locked --target "${{ matrix.target }}" \
            -p mirante-cli -p mirante-daemon -p mirante-hook -p mirante-mcp
      - name: Package
        run: |
          name="mirante-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          for b in mirante mirante-daemon mirante-hook mirante-mcp; do
            cp "target/${{ matrix.target }}/release/$b" "dist/$name/"
          done
          cp LICENSE THIRD_PARTY_NOTICES.md README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
          ls -l dist
      # Only the runner's own architecture can run here (no Rosetta on the hosted runners).
      - name: Smoke test (native architecture)
        run: |
          native="$(uname -m | sed 's/arm64/aarch64/')-apple-darwin"
          if [ "$native" != "${{ matrix.target }}" ]; then
            file "target/${{ matrix.target }}/release/mirante"
            exit 0
          fi
          dir="$(mktemp -d)"
          tar -C "$dir" -xzf dist/*.tar.gz
          bin="$(echo "$dir"/mirante-*)"
          "$bin/mirante" --version | grep -F "${{ steps.version.outputs.version }}"
          "$bin/mirante-daemon" --version | grep -F "${{ steps.version.outputs.version }}"
          "$bin/mirante-mcp" --version | grep -F "${{ steps.version.outputs.version }}"
          "$bin/mirante" help > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      # The release notes are this version's section of CHANGELOG.md.
      - name: Release notes
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            /^## / || /^\[[^]]+\]: / { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::no CHANGELOG.md section for $version"
            echo "Mirante $version." > notes.md
          fi
          {
            echo
            echo "Install with Homebrew: \`brew install sirus-alpha-canis/tap/mirante\`, then"
            echo "\`mirante daemon start\` and \`mirante doctor\`. Checksums: SHA256SUMS."
          } >> notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "Mirante $version" --notes-file notes.md
          fi

  # Optional: rewrites Formula/mirante.rb in the tap. Skips cleanly without the secret.
  homebrew-tap:
    name: Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: HOMEBREW_TAP_TOKEN present?
        id: token
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; skipping the tap update (see RELEASING.md)"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.ok == 'true'
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.token.outputs.ok == 'true'
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Update Formula/mirante.rb
        if: steps.token.outputs.ok == 'true'
        run: |
          version="${TAG#v}"
          sha() { sha256sum "dist/mirante-$version-$1.tar.gz" | cut -d' ' -f1; }
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/sirus-alpha-canis/homebrew-tap.git" tap
          mkdir -p tap/Formula
          scripts/homebrew-formula.sh "$version" "$(sha aarch64-apple-darwin)" "$(sha x86_64-apple-darwin)" \
            > tap/Formula/mirante.rb
          cd tap
          git add -A
          if git diff --cached --quiet; then
            echo "the formula is already at $version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "mirante $version"
          git push origin HEAD:main
