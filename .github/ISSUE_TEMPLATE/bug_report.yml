name: Bug report
description: Something in Mirante does not work as the README says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, do not open an issue: see SECURITY.md.
        Before posting logs, remove anything private (paths, repo names, prompts, tokens).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. mirante new . --agent claude "…"
        2. …
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Paste the output of these commands.
      value: |
        git rev-parse --short HEAD   (in the Mirante checkout)
        mirante --version
        sw_vers -productVersion
        claude --version / codex --version
      render: text
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: mirante doctor
      description: The output of `mirante doctor` (which agent binaries the daemon found, memory).
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant end of `~/.mirante/daemon.log`, and the error with `mirante --verbose <command>`.
      render: text
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options:
        - CLI
        - Desktop app
        - Daemon
        - install.sh / uninstall.sh / try.sh
        - Repo memory
        - Skills
