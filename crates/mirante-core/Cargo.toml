[package]
name = "mirante-core"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[dependencies]
libc = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v7"] }
