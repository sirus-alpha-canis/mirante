<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Mirante</title>
    <script src="/theme-boot.js"></script>
    <!--
      The launch splash: painted from the very first frame, before any script of the app runs
      (pure CSS and SVG, nothing remote: the CSP allows neither). The mark is Vibely's ribbon
      (src/assets/brand/ribbon.svg, used by permission of its owner), two-tone in both themes;
      the wordmark is "Mirante" in Nunito Sans Bold, outlined to a path, so no font is needed
      yet. Our own motion: the ribbon draws in from its centre, then the word fades up (480ms
      in all, once; none with reduced motion). The app's own waiting state
      (src/components/Splash.tsx) draws the same shapes with these classes.
      Background, text and muted match the app's --panel, --text and --muted (src/styles.css):
      no flash, in either theme.
    -->
    <style>
      :root {
        --splash-bg: #fafafa;
        --splash-text: #1e1e1e;
        --splash-muted: #3b3b3b;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --splash-bg: #1a1a1a;
          --splash-text: #fafafa;
          --splash-muted: #bbbbbb;
        }
      }
      :root[data-theme="dark"] {
        --splash-bg: #1a1a1a;
        --splash-text: #fafafa;
        --splash-muted: #bbbbbb;
      }
      html { background: var(--splash-bg); }
      body { margin: 0; background: var(--splash-bg); }
      .splash {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        color: var(--splash-text);
        font-family: "Nunito Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #splash { position: fixed; inset: 0; z-index: 1000; background: var(--splash-bg); transition: opacity 180ms ease-out; }
      #splash.splash-out { opacity: 0; pointer-events: none; }
      .splash-inline { flex: 1; min-height: 240px; }
      .splash .ribbon { width: 112px; height: 43.2px; flex: none; }
      .splash .wordmark { width: 76px; height: 16px; flex: none; }
      .splash .ribbon:not(.ribbon-still) { animation: splash-ribbon 420ms ease-out both; }
      .splash .wordmark { animation: splash-word 300ms ease-out 180ms both; }
      .splash-note { font-size: 13px; color: var(--splash-muted); margin: 0; }
      @keyframes splash-ribbon { from { clip-path: inset(0 50%); opacity: 0.35; } to { clip-path: inset(0 0); opacity: 1; } }
      @keyframes splash-word { from { opacity: 0; transform: translateY(3px); } }
      @media (prefers-reduced-motion: reduce) {
        .splash .ribbon, .splash .wordmark, #splash { animation: none; transition: none; }
      }
    </style>
  </head>
